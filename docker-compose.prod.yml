services:
  # ==========================================
  # 1. FRONTEND DASHBOARD (Nginx Reverse Proxy & React UI)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: het-frontend
    ports:
      - "80:80"
      - "3001:80"
    depends_on:
      - api-gateway
      - keycloak
    networks:
      - het-network
    restart: always

  # ==========================================
  # 2. CORE INFRASTRUCTURE & DATA STORES
  # ==========================================
  mysql:
    image: mysql:8.3.0
    container_name: het-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: home_energy_tracker
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql
    networks:
      - het-network

  keycloak-db:
    image: mysql:8.3.0
    container_name: het-keycloak-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    networks:
      - het-network

  kafka:
    container_name: het-kafka
    image: apache/kafka:latest
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: 'energy-tracker-cluster-1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:9094,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - het-network

  kafka-ui:
    container_name: het-kafka-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8070:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - het-network

  influxdb:
    image: influxdb:2.7
    container_name: het-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: energy_tracker_org
      DOCKER_INFLUXDB_INIT_BUCKET: energy_bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: secret-influxdb-token-123456789
    networks:
      - het-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: het-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - het-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    container_name: het-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/keycloak?useSSL=false&allowPublicKeyRetrieval=true
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8091:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-db
    networks:
      - het-network

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: het-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=5d
      - --web.enable-lifecycle
    networks:
      - het-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: het-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - het-network

  # ==========================================
  # 3. SPRING BOOT 4 / JAVA 21 MICROSERVICES
  # ==========================================
  api-gateway:
    image: eclipse-temurin:21-jre-alpine
    container_name: het-api-gateway
    working_dir: /app
    volumes:
      - ./api-gateway/api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
    networks:
      - het-network

  user-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: het-user-service
    working_dir: /app
    volumes:
      - ./user-service/target/user-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8086:8086"
    depends_on:
      - mysql
    networks:
      - het-network

  device-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: het-device-service
    working_dir: /app
    volumes:
      - ./device-service/target/device-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8081:8081"
    depends_on:
      - mysql
    networks:
      - het-network

  ingestion-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: het-ingestion-service
    working_dir: /app
    volumes:
      - ./ingestion-service/target/ingestion-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8082:8082"
    depends_on:
      - kafka
    networks:
      - het-network

  usage-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: het-usage-service
    working_dir: /app
    volumes:
      - ./usage-service/target/usage-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - influxdb
    networks:
      - het-network

  alert-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: het-alert-service
    working_dir: /app
    volumes:
      - ./alert-service/alert-service/target/alert-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - kafka
      - mailpit
    networks:
      - het-network

  insight-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: het-insight-service
    working_dir: /app
    volumes:
      - ./insight-service/target/insight-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8085:8085"
    networks:
      - het-network

networks:
  het-network:
    driver: bridge

volumes:
  db-data:
